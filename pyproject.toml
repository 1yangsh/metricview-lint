[project]
name = "metricview-lint"
version = "0.1.0"
description = "Offline linter and MCP server for Databricks Unity Catalog metric view YAML"
readme = "README.md"
authors = [
    { name = "Seunghyeon Yang", email = "61305117+1yangsh@users.noreply.github.com" }
]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["databricks", "unity-catalog", "metric-views", "semantic-layer", "linter", "mcp", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0.4",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2,<3",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[project.scripts]
metricview-lint = "metricview_lint.cli:main"

[project.urls]
Repository = "https://github.com/1yangsh/metricview-lint"
Issues = "https://github.com/1yangsh/metricview-lint/issues"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # the formatter owns line length; long messages read better unbroken

[tool.pyright]
include = ["src"]
